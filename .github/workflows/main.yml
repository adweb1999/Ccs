name: Build OneStateLogin dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Install iOS SDK
        run: |
          export THEOS=~/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/ || true

      - name: Download ImGui
        run: |
          rm -rf imgui
          mkdir -p imgui
          cd imgui
          curl -L "https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.tar.gz" -o imgui.tar.gz
          tar -xzf imgui.tar.gz --strip-components=1
          rm imgui.tar.gz
          mv imgui.cpp imgui.h imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp imgui_demo.cpp . 2>/dev/null || true
          mv backends/imgui_impl_metal.h backends/imgui_impl_metal.mm . 2>/dev/null || true
          echo '#pragma once' > imgui_impl_osx.h
          echo 'inline void ImGui_ImplOSX_Init(void*) {}' >> imgui_impl_osx.h
          echo 'inline void ImGui_ImplOSX_Shutdown() {}' >> imgui_impl_osx.h
          echo 'inline void ImGui_ImplOSX_NewFrame() {}' >> imgui_impl_osx.h
          echo '#include "imgui_impl_osx.h"' > imgui_impl_osx.mm
          cd ..

      - name: Build dylib
        run: |
          export THEOS=~/theos
          export PATH="$THEOS/bin:$PATH"
          make clean
          make DEBUG=0

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: OneStateLogin-dylib
          path: .theos/obj/OneStateLogin.dylib
          retention-days: 30
